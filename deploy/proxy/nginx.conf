# Single entry point for the API. The proxy only routes: it does not
# authenticate or authorize. Every service validates the access token itself,
# so reaching a service directly grants nothing.

map $http_x_request_id $medicitas_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

upstream tenancy    { server tenancy:8080; }
upstream agenda     { server agenda:8080; }
upstream expediente { server expediente:8080; }
upstream audit      { server audit:8080; }

server {
    listen 8080;
    server_name _;

    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Request-ID      $medicitas_request_id;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_read_timeout    30s;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # Service-to-service routes are never exposed outside the Compose network.
    location /internal/ {
        return 404;
    }

    # Tenancy: clinics (RF1), users (RF2) and the caller's identity.
    location /api/v1/platform/ { proxy_pass http://tenancy; }
    location = /api/v1/users   { proxy_pass http://tenancy; }
    location /api/v1/users/    { proxy_pass http://tenancy; }
    location = /api/v1/me      { proxy_pass http://tenancy; }

    # Expediente: clinical notes (RF15).
    location /api/v1/clinical-notes { proxy_pass http://expediente; }

    # Audit: audit log (RF19).
    location /api/v1/audit { proxy_pass http://audit; }

    # Agenda: everything else under /api/v1 (catalog, schedules, patients,
    # availability, appointments, daily agenda, reports).
    location /api/v1/ { proxy_pass http://agenda; }

    location / {
        default_type application/json;
        return 404 '{"error":"route not found"}';
    }
}
