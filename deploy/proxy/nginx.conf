# Único punto de entrada de la API. El proxy solo enruta: no autentica ni
# autoriza. Cada servicio valida el token de acceso por su cuenta, así que
# llegar directo a un servicio no concede nada.

map $http_x_request_id $medicitas_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

# Docker le da otra IP a un contenedor cada vez que lo recrea. Con el nombre
# escrito directo en proxy_pass, nginx lo resuelve una sola vez al arrancar y
# después de un `docker compose up --build` seguiría enviando el tráfico a la
# IP anterior, que ahora puede ser de otro servicio. Con el destino en una
# variable, nginx vuelve a consultar el DNS interno de Docker (127.0.0.11) y
# sigue a los servicios sin tener que reiniciar el proxy.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 8080;
    server_name _;

    set $tenancy    http://tenancy:8080;
    set $agenda     http://agenda:8080;
    set $expediente http://expediente:8080;
    set $audit      http://audit:8080;

    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Request-ID      $medicitas_request_id;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_read_timeout    30s;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # Las rutas entre servicios nunca se exponen fuera de la red de Compose.
    location /internal/ {
        return 404;
    }

    # Tenancy: clínicas (RF1), usuarios (RF2) y la identidad de quien llama.
    location /api/v1/platform/ { proxy_pass $tenancy; }
    location = /api/v1/users   { proxy_pass $tenancy; }
    location /api/v1/users/    { proxy_pass $tenancy; }
    location = /api/v1/me      { proxy_pass $tenancy; }

    # Expediente: notas clínicas (RF15).
    location /api/v1/clinical-notes { proxy_pass $expediente; }

    # Auditoría: bitácora de auditoría (RF19).
    location /api/v1/audit { proxy_pass $audit; }

    # Agenda: todo lo demás bajo /api/v1 (catálogo, horarios, pacientes,
    # disponibilidad, citas, agenda del día e informes).
    location /api/v1/ { proxy_pass $agenda; }

    location / {
        default_type application/json;
        return 404 '{"error":"route not found"}';
    }
}
