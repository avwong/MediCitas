# Único punto de entrada de la API. El proxy solo enruta: no autentica ni
# autoriza. Cada servicio valida el token de acceso por su cuenta, así que
# llegar directo a un servicio no concede nada.

map $http_x_request_id $medicitas_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

upstream tenancy    { server tenancy:8080; }
upstream agenda     { server agenda:8080; }
upstream expediente { server expediente:8080; }
upstream audit      { server audit:8080; }

server {
    listen 8080;
    server_name _;

    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Request-ID      $medicitas_request_id;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_read_timeout    30s;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # Las rutas entre servicios nunca se exponen fuera de la red de Compose.
    location /internal/ {
        return 404;
    }

    # Tenancy: clínicas (RF1), usuarios (RF2) y la identidad de quien llama.
    location /api/v1/platform/ { proxy_pass http://tenancy; }
    location = /api/v1/users   { proxy_pass http://tenancy; }
    location /api/v1/users/    { proxy_pass http://tenancy; }
    location = /api/v1/me      { proxy_pass http://tenancy; }

    # Expediente: notas clínicas (RF15).
    location /api/v1/clinical-notes { proxy_pass http://expediente; }

    # Auditoría: bitácora de auditoría (RF19).
    location /api/v1/audit { proxy_pass http://audit; }

    # Agenda: todo lo demás bajo /api/v1 (catálogo, horarios, pacientes,
    # disponibilidad, citas, agenda del día e informes).
    location /api/v1/ { proxy_pass http://agenda; }

    location / {
        default_type application/json;
        return 404 '{"error":"route not found"}';
    }
}
