services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: medicitas-api:dev
    container_name: medicitas-api
    environment:
      APP_PORT: "8080"

      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-medicitas}
      DB_USER: ${POSTGRES_USER:-medicitas}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-medicitas_dev}

      REDIS_HOST: redis
      REDIS_PORT: "6379"

      KEYCLOAK_URL: http://keycloak:8080
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: medicitas-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medicitas}
      POSTGRES_USER: ${POSTGRES_USER:-medicitas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medicitas_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-medicitas} -d ${POSTGRES_DB:-medicitas}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: medicitas-redis
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: medicitas-keycloak
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_dev}
    ports:
      - "127.0.0.1:8081:8080"

volumes:
  postgres_data: