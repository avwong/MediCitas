name: medicitas

# Settings shared by the four MediCitas services.
x-service-environment: &service-environment
  HTTP_ADDR: ":8080"
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DB_HOST: postgres
  DB_PORT: "5432"
  # Keycloak always issues tokens with this issuer (KC_HOSTNAME below), so
  # the value matches whether the token was requested from the host or from
  # inside the network.
  OIDC_ISSUER_URL: ${KEYCLOAK_PUBLIC_URL}/realms/medicitas
  OIDC_JWKS_URL: http://keycloak:8080/realms/medicitas/protocol/openid-connect/certs
  OIDC_AUDIENCE: medicitas-api

x-service-healthcheck: &service-healthcheck
  test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
  interval: 5s
  timeout: 3s
  retries: 20

x-service-dependencies: &service-dependencies
  db-seed:
    condition: service_completed_successfully
  keycloak:
    condition: service_healthy

services:
  # --------------------------------------------------------------------------
  # Entry point
  # --------------------------------------------------------------------------
  proxy:
    image: nginx:1.27-alpine
    container_name: medicitas-proxy
    ports:
      - "127.0.0.1:${APP_PORT}:8080"
    volumes:
      - ./deploy/proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      tenancy:
        condition: service_healthy
      agenda:
        condition: service_healthy
      expediente:
        condition: service_healthy
      audit:
        condition: service_healthy

  # --------------------------------------------------------------------------
  # MediCitas services
  # --------------------------------------------------------------------------
  tenancy:
    build:
      context: .
      args:
        SERVICE: tenancy
    image: medicitas-tenancy:dev
    container_name: medicitas-tenancy
    environment:
      <<: *service-environment
      DB_NAME: tenancy_db
      DB_USER: tenancy_app
      DB_PASSWORD: ${TENANCY_DB_APP_PASSWORD}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_REALM: medicitas
      TENANCY_CLIENT_ID: tenancy-service
      TENANCY_CLIENT_SECRET: ${TENANCY_CLIENT_SECRET}
      AGENDA_URL: http://agenda:8080
    healthcheck: *service-healthcheck
    depends_on:
      <<: *service-dependencies

  agenda:
    build:
      context: .
      args:
        SERVICE: agenda
    image: medicitas-agenda:dev
    container_name: medicitas-agenda
    environment:
      <<: *service-environment
      DB_NAME: agenda_db
      DB_USER: agenda_app
      DB_PASSWORD: ${AGENDA_DB_APP_PASSWORD}
      TENANCY_URL: http://tenancy:8080
      TENANCY_SERVICE_CLIENT_ID: tenancy-service
    healthcheck: *service-healthcheck
    depends_on:
      <<: *service-dependencies
      redis:
        condition: service_healthy

  expediente:
    build:
      context: .
      args:
        SERVICE: expediente
    image: medicitas-expediente:dev
    container_name: medicitas-expediente
    environment:
      <<: *service-environment
      DB_NAME: expediente_db
      DB_USER: expediente_app
      DB_PASSWORD: ${EXPEDIENTE_DB_APP_PASSWORD}
      AGENDA_URL: http://agenda:8080
    healthcheck: *service-healthcheck
    depends_on:
      <<: *service-dependencies

  audit:
    build:
      context: .
      args:
        SERVICE: audit
    image: medicitas-audit:dev
    container_name: medicitas-audit
    environment:
      <<: *service-environment
      DB_NAME: audit_db
      DB_USER: audit_app
      DB_PASSWORD: ${AUDIT_DB_APP_PASSWORD}
    healthcheck: *service-healthcheck
    depends_on:
      <<: *service-dependencies

  # --------------------------------------------------------------------------
  # Infrastructure
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: medicitas-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates one database and three least-privilege roles per service. Idempotent.
  db-init:
    image: postgres:17-alpine
    container_name: medicitas-db-init
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
      TENANCY_DB_OWNER_PASSWORD: ${TENANCY_DB_OWNER_PASSWORD}
      TENANCY_DB_APP_PASSWORD: ${TENANCY_DB_APP_PASSWORD}
      TENANCY_DB_READONLY_PASSWORD: ${TENANCY_DB_READONLY_PASSWORD}
      AGENDA_DB_OWNER_PASSWORD: ${AGENDA_DB_OWNER_PASSWORD}
      AGENDA_DB_APP_PASSWORD: ${AGENDA_DB_APP_PASSWORD}
      AGENDA_DB_READONLY_PASSWORD: ${AGENDA_DB_READONLY_PASSWORD}
      EXPEDIENTE_DB_OWNER_PASSWORD: ${EXPEDIENTE_DB_OWNER_PASSWORD}
      EXPEDIENTE_DB_APP_PASSWORD: ${EXPEDIENTE_DB_APP_PASSWORD}
      EXPEDIENTE_DB_READONLY_PASSWORD: ${EXPEDIENTE_DB_READONLY_PASSWORD}
      AUDIT_DB_OWNER_PASSWORD: ${AUDIT_DB_OWNER_PASSWORD}
      AUDIT_DB_APP_PASSWORD: ${AUDIT_DB_APP_PASSWORD}
      AUDIT_DB_READONLY_PASSWORD: ${AUDIT_DB_READONLY_PASSWORD}
    volumes:
      - ./deploy/postgres/init-databases.sh:/init-databases.sh:ro
    entrypoint: ["sh", "/init-databases.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  # Migrations run as each database's owner role.
  migrate-tenancy:
    image: migrate/migrate:v4.18.3
    container_name: medicitas-migrate-tenancy
    volumes:
      - ./migrations/tenancy:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://tenancy_owner:${TENANCY_DB_OWNER_PASSWORD}@postgres:5432/tenancy_db?sslmode=disable"
      - "up"
    depends_on:
      db-init:
        condition: service_completed_successfully

  migrate-agenda:
    image: migrate/migrate:v4.18.3
    container_name: medicitas-migrate-agenda
    volumes:
      - ./migrations/agenda:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://agenda_owner:${AGENDA_DB_OWNER_PASSWORD}@postgres:5432/agenda_db?sslmode=disable"
      - "up"
    depends_on:
      db-init:
        condition: service_completed_successfully

  db-seed:
    image: postgres:17-alpine
    container_name: medicitas-db-seed
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./seed:/seed:ro
    entrypoint:
      - "sh"
      - "-c"
      - >-
        psql -v ON_ERROR_STOP=1 -d tenancy_db -f /seed/tenancy.sql &&
        psql -v ON_ERROR_STOP=1 -d agenda_db -f /seed/agenda.sql
    depends_on:
      migrate-tenancy:
        condition: service_completed_successfully
      migrate-agenda:
        condition: service_completed_successfully

  redis:
    image: redis:7-alpine
    container_name: medicitas-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: medicitas-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Fixes the issuer of every token, however Keycloak is reached.
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL}
      KC_HEALTH_ENABLED: "true"
      # Resolved by the ${TENANCY_CLIENT_SECRET} placeholder in the realm file.
      TENANCY_CLIENT_SECRET: ${TENANCY_CLIENT_SECRET}
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT}:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # The image has no curl or wget; bash's /dev/tcp reaches the management
      # port, where Keycloak reports readiness.
      test:
        - "CMD"
        - "bash"
        - "-c"
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  postgres_data:
