name: medicitas

# Configuración que comparten los cuatro servicios de MediCitas.
x-service-environment: &service-environment
  HTTP_ADDR: ":8080"
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DB_HOST: postgres
  DB_PORT: "5432"
  # Keycloak emite siempre los tokens con este emisor (KC_HOSTNAME, más abajo),
  # así que el valor coincide tanto si el token se pidió desde el host como
  # desde dentro de la red.
  OIDC_ISSUER_URL: ${KEYCLOAK_PUBLIC_URL}/realms/medicitas
  OIDC_JWKS_URL: http://keycloak:8080/realms/medicitas/protocol/openid-connect/certs
  OIDC_TOKEN_URL: http://keycloak:8080/realms/medicitas/protocol/openid-connect/token
  OIDC_AUDIENCE: medicitas-api

x-service-healthcheck: &service-healthcheck
  test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
  interval: 5s
  timeout: 3s
  retries: 20

x-service-dependencies: &service-dependencies
  db-seed:
    condition: service_completed_successfully
  keycloak:
    condition: service_healthy

services:
  # --------------------------------------------------------------------------
  # Punto de entrada
  # --------------------------------------------------------------------------
  proxy:
    image: nginx:1.27-alpine
    container_name: medicitas-proxy
    ports:
      - "127.0.0.1:${APP_PORT}:8080"
    volumes:
      - ./deploy/proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      tenancy:
        condition: service_healthy
      agenda:
        condition: service_healthy
      expediente:
        condition: service_healthy
      audit:
        condition: service_healthy

  # --------------------------------------------------------------------------
  # Servicios de MediCitas
  # --------------------------------------------------------------------------
  tenancy:
    build:
      context: .
      args:
        SERVICE: tenancy
    image: medicitas-tenancy:dev
    container_name: medicitas-tenancy
    environment:
      <<: *service-environment
      DB_NAME: tenancy_db
      DB_USER: tenancy_app
      DB_PASSWORD: ${TENANCY_DB_APP_PASSWORD}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_REALM: medicitas
      TENANCY_CLIENT_ID: tenancy-service
      TENANCY_CLIENT_SECRET: ${TENANCY_CLIENT_SECRET}
      AGENDA_URL: http://agenda:8080
    healthcheck: *service-healthcheck
    depends_on:
      <<: *service-dependencies

  agenda:
    build:
      context: .
      args:
        SERVICE: agenda
    image: medicitas-agenda:dev
    container_name: medicitas-agenda
    environment:
      <<: *service-environment
      DB_NAME: agenda_db
      DB_USER: agenda_app
      DB_PASSWORD: ${AGENDA_DB_APP_PASSWORD}
      TENANCY_URL: http://tenancy:8080
      TENANCY_SERVICE_CLIENT_ID: tenancy-service
      AUDIT_URL: http://audit:8080
      OUTBOX_CLIENT_ID: agenda-service
      OUTBOX_CLIENT_SECRET: ${AGENDA_CLIENT_SECRET}
    healthcheck: *service-healthcheck
    depends_on:
      <<: *service-dependencies
      redis:
        condition: service_healthy

  expediente:
    build:
      context: .
      args:
        SERVICE: expediente
    image: medicitas-expediente:dev
    container_name: medicitas-expediente
    environment:
      <<: *service-environment
      DB_NAME: expediente_db
      DB_USER: expediente_app
      DB_PASSWORD: ${EXPEDIENTE_DB_APP_PASSWORD}
      AGENDA_URL: http://agenda:8080
      AUDIT_URL: http://audit:8080
      OUTBOX_CLIENT_ID: expediente-service
      OUTBOX_CLIENT_SECRET: ${EXPEDIENTE_CLIENT_SECRET}
    healthcheck: *service-healthcheck
    depends_on:
      <<: *service-dependencies

  audit:
    build:
      context: .
      args:
        SERVICE: audit
    image: medicitas-audit:dev
    container_name: medicitas-audit
    environment:
      <<: *service-environment
      DB_NAME: audit_db
      DB_USER: audit_app
      DB_PASSWORD: ${AUDIT_DB_APP_PASSWORD}
      AGENDA_SERVICE_CLIENT_ID: agenda-service
      EXPEDIENTE_SERVICE_CLIENT_ID: expediente-service
    healthcheck: *service-healthcheck
    depends_on:
      <<: *service-dependencies

  # --------------------------------------------------------------------------
  # Infraestructura
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: medicitas-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Reservado para la caché de disponibilidad (RF7, RF8). Agenda todavía no lo
  # usa.
  redis:
    image: redis:7-alpine
    container_name: medicitas-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: medicitas-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Fija el emisor de todos los tokens, sin importar cómo se llegue a Keycloak.
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL}
      KC_HEALTH_ENABLED: "true"
      # El archivo del realm los toma con marcadores como ${TENANCY_CLIENT_SECRET}.
      TENANCY_CLIENT_SECRET: ${TENANCY_CLIENT_SECRET}
      AGENDA_CLIENT_SECRET: ${AGENDA_CLIENT_SECRET}
      EXPEDIENTE_CLIENT_SECRET: ${EXPEDIENTE_CLIENT_SECRET}
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT}:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # La imagen no trae curl ni wget; con /dev/tcp de bash se llega al puerto
      # de administración, donde Keycloak informa si está listo.
      test:
        - "CMD"
        - "bash"
        - "-c"
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # --------------------------------------------------------------------------
  # Preparación de las bases de datos
  #
  # Trabajos que corren una vez y terminan. Los servicios esperan a db-seed, el
  # último de la cadena: db-init -> migrate-* -> db-seed.
  # --------------------------------------------------------------------------

  # Crea una base de datos y tres roles de menor privilegio por servicio. Es
  # idempotente.
  db-init:
    image: postgres:17-alpine
    container_name: medicitas-db-init
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
      TENANCY_DB_OWNER_PASSWORD: ${TENANCY_DB_OWNER_PASSWORD}
      TENANCY_DB_APP_PASSWORD: ${TENANCY_DB_APP_PASSWORD}
      TENANCY_DB_READONLY_PASSWORD: ${TENANCY_DB_READONLY_PASSWORD}
      AGENDA_DB_OWNER_PASSWORD: ${AGENDA_DB_OWNER_PASSWORD}
      AGENDA_DB_APP_PASSWORD: ${AGENDA_DB_APP_PASSWORD}
      AGENDA_DB_READONLY_PASSWORD: ${AGENDA_DB_READONLY_PASSWORD}
      EXPEDIENTE_DB_OWNER_PASSWORD: ${EXPEDIENTE_DB_OWNER_PASSWORD}
      EXPEDIENTE_DB_APP_PASSWORD: ${EXPEDIENTE_DB_APP_PASSWORD}
      EXPEDIENTE_DB_READONLY_PASSWORD: ${EXPEDIENTE_DB_READONLY_PASSWORD}
      AUDIT_DB_OWNER_PASSWORD: ${AUDIT_DB_OWNER_PASSWORD}
      AUDIT_DB_APP_PASSWORD: ${AUDIT_DB_APP_PASSWORD}
      AUDIT_DB_READONLY_PASSWORD: ${AUDIT_DB_READONLY_PASSWORD}
    volumes:
      - ./deploy/postgres/init-databases.sh:/init-databases.sh:ro
    entrypoint: ["sh", "/init-databases.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  # Las migraciones corren con el rol dueño de cada base.
  migrate-tenancy:
    image: migrate/migrate:v4.18.3
    container_name: medicitas-migrate-tenancy
    volumes:
      - ./migrations/tenancy:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://tenancy_owner:${TENANCY_DB_OWNER_PASSWORD}@postgres:5432/tenancy_db?sslmode=disable"
      - "up"
    depends_on:
      db-init:
        condition: service_completed_successfully

  migrate-agenda:
    image: migrate/migrate:v4.18.3
    container_name: medicitas-migrate-agenda
    volumes:
      - ./migrations/agenda:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://agenda_owner:${AGENDA_DB_OWNER_PASSWORD}@postgres:5432/agenda_db?sslmode=disable"
      - "up"
    depends_on:
      db-init:
        condition: service_completed_successfully

  migrate-expediente:
    image: migrate/migrate:v4.18.3
    container_name: medicitas-migrate-expediente
    volumes:
      - ./migrations/expediente:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://expediente_owner:${EXPEDIENTE_DB_OWNER_PASSWORD}@postgres:5432/expediente_db?sslmode=disable"
      - "up"
    depends_on:
      db-init:
        condition: service_completed_successfully

  migrate-audit:
    image: migrate/migrate:v4.18.3
    container_name: medicitas-migrate-audit
    volumes:
      - ./migrations/audit:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://audit_owner:${AUDIT_DB_OWNER_PASSWORD}@postgres:5432/audit_db?sslmode=disable"
      - "up"
    depends_on:
      db-init:
        condition: service_completed_successfully

  # Carga los datos de ejemplo. Usa el superusuario porque es un trabajo de
  # desarrollo; la semilla se puede ejecutar varias veces.
  db-seed:
    image: postgres:17-alpine
    container_name: medicitas-db-seed
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./seed:/seed:ro
    entrypoint:
      - "sh"
      - "-c"
      - >-
        psql -v ON_ERROR_STOP=1 -d tenancy_db -f /seed/tenancy.sql &&
        psql -v ON_ERROR_STOP=1 -d agenda_db -f /seed/agenda.sql &&
        psql -v ON_ERROR_STOP=1 -d expediente_db -f /seed/expediente.sql
    depends_on:
      migrate-tenancy:
        condition: service_completed_successfully
      migrate-agenda:
        condition: service_completed_successfully
      migrate-expediente:
        condition: service_completed_successfully
      migrate-audit:
        condition: service_completed_successfully

  # --------------------------------------------------------------------------
  # Pruebas de integración (perfil "test")
  #
  # No arrancan con `docker compose up`. Se ejecutan con
  # `docker compose --profile test run --rm <prueba>`; ver docs/pruebas.md.
  # --------------------------------------------------------------------------

  # Fronteras de privilegios de PostgreSQL.
  db-security-test:
    profiles: ["test"]
    image: postgres:17-alpine
    container_name: medicitas-db-security-test
    environment:
      TENANCY_DB_OWNER_PASSWORD: ${TENANCY_DB_OWNER_PASSWORD}
      TENANCY_DB_APP_PASSWORD: ${TENANCY_DB_APP_PASSWORD}
      TENANCY_DB_READONLY_PASSWORD: ${TENANCY_DB_READONLY_PASSWORD}

      AGENDA_DB_OWNER_PASSWORD: ${AGENDA_DB_OWNER_PASSWORD}
      AGENDA_DB_APP_PASSWORD: ${AGENDA_DB_APP_PASSWORD}
      AGENDA_DB_READONLY_PASSWORD: ${AGENDA_DB_READONLY_PASSWORD}

      EXPEDIENTE_DB_OWNER_PASSWORD: ${EXPEDIENTE_DB_OWNER_PASSWORD}
      EXPEDIENTE_DB_APP_PASSWORD: ${EXPEDIENTE_DB_APP_PASSWORD}
      EXPEDIENTE_DB_READONLY_PASSWORD: ${EXPEDIENTE_DB_READONLY_PASSWORD}

      AUDIT_DB_OWNER_PASSWORD: ${AUDIT_DB_OWNER_PASSWORD}
      AUDIT_DB_APP_PASSWORD: ${AUDIT_DB_APP_PASSWORD}
      AUDIT_DB_READONLY_PASSWORD: ${AUDIT_DB_READONLY_PASSWORD}
    volumes:
      - ./deploy/postgres/test-privileges.sh:/test-privileges.sh:ro
    entrypoint: ["sh", "/test-privileges.sh"]
    depends_on:
      migrate-tenancy:
        condition: service_completed_successfully
      migrate-agenda:
        condition: service_completed_successfully
      migrate-expediente:
        condition: service_completed_successfully
      migrate-audit:
        condition: service_completed_successfully

  # Inmutabilidad e idempotencia de la auditoría (I6).
  audit-invariants-test:
    profiles: ["test"]
    image: postgres:17-alpine
    container_name: medicitas-audit-invariants-test
    environment:
      PGHOST: postgres
      AGENDA_DB_OWNER_PASSWORD: ${AGENDA_DB_OWNER_PASSWORD}
      AGENDA_DB_APP_PASSWORD: ${AGENDA_DB_APP_PASSWORD}
      EXPEDIENTE_DB_OWNER_PASSWORD: ${EXPEDIENTE_DB_OWNER_PASSWORD}
      EXPEDIENTE_DB_APP_PASSWORD: ${EXPEDIENTE_DB_APP_PASSWORD}
      AUDIT_DB_OWNER_PASSWORD: ${AUDIT_DB_OWNER_PASSWORD}
      AUDIT_DB_APP_PASSWORD: ${AUDIT_DB_APP_PASSWORD}
    volumes:
      - ./deploy/postgres/test-audit-invariants.sh:/test-audit-invariants.sh:ro
    entrypoint: ["sh", "/test-audit-invariants.sh"]
    depends_on:
      migrate-agenda:
        condition: service_completed_successfully
      migrate-expediente:
        condition: service_completed_successfully
      migrate-audit:
        condition: service_completed_successfully

  # Entrega real de los relays de Agenda y Expediente hacia Auditoría.
  audit-relay-test:
    profiles: ["test"]
    image: postgres:17-alpine
    container_name: medicitas-audit-relay-test
    environment:
      PGHOST: postgres
      AGENDA_DB_APP_PASSWORD: ${AGENDA_DB_APP_PASSWORD}
      EXPEDIENTE_DB_APP_PASSWORD: ${EXPEDIENTE_DB_APP_PASSWORD}
      AUDIT_DB_APP_PASSWORD: ${AUDIT_DB_APP_PASSWORD}
    volumes:
      - ./deploy/postgres/test-relay-delivery.sh:/test-relay-delivery.sh:ro
    entrypoint: ["sh", "/test-relay-delivery.sh"]
    depends_on:
      agenda:
        condition: service_healthy
      expediente:
        condition: service_healthy
      audit:
        condition: service_healthy

  # Autenticación, permisos y aislamiento entre clínicas por HTTP.
  p1-api-integration-test:
    profiles: ["test"]
    build:
      context: .
      args:
        SERVICE: p1check
    image: medicitas-p1-integration-test:dev
    environment:
      API_URL: http://proxy:8080
      KEYCLOAK_URL: http://keycloak:8080
      AGENDA_CLIENT_SECRET: ${AGENDA_CLIENT_SECRET}
    depends_on:
      proxy:
        condition: service_started
      keycloak:
        condition: service_healthy

  # Agenda: pacientes (RF14), auditoría de contacto (RF18) y aislamiento (I5).
  agenda-api-integration-test:
    profiles: ["test"]
    build:
      context: .
      args:
        SERVICE: agendacheck
    image: medicitas-agenda-integration-test:dev
    environment:
      API_URL: http://proxy:8080
      KEYCLOAK_URL: http://keycloak:8080
    depends_on:
      proxy:
        condition: service_started
      keycloak:
        condition: service_healthy
      audit:
        condition: service_healthy

  # Fuga entre clínicas (I5) en los cuatro servicios.
  leak-integration-test:
    profiles: ["test"]
    build:
      context: .
      args:
        SERVICE: leakcheck
    image: medicitas-leak-integration-test:dev
    environment:
      API_URL: http://proxy:8080
      KEYCLOAK_URL: http://keycloak:8080
    depends_on:
      proxy:
        condition: service_started
      keycloak:
        condition: service_healthy
      audit:
        condition: service_healthy
      expediente:
        condition: service_healthy

volumes:
  postgres_data:
